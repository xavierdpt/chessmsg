<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>chessmsg</title>
<style>
  :root {
    --cell: min(12.5vw, 56px);
    --light: #f0d9b5;
    --dark:  #b58863;
    --arrow: rgba(102, 41, 102, 0.55);
    --accent: #6a696a;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: contain;
  }
  body {
    display: flex; flex-direction: column;
    height: 100vh;
  }
  @supports (height: 100dvh) {
    body { height: 100dvh; }
  }
  #board-wrap {
    position: relative;
    margin: 8px auto;
    padding: 0;
    width: calc(var(--cell) * 8);
    height: calc(var(--cell) * 8);
    background: var(--dark);
    user-select: none;
    touch-action: none;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows:    repeat(8, var(--cell));
    width: 100%; height: 100%;
  }
  .sq { position: relative; }
  .light { background: var(--light); }
  .dark  { background: var(--dark);  }
  .sq .p {
    position: absolute;
    inset: 0;
    display: grid; place-items: center;
    pointer-events: none;
  }
  .sq .p img {
    width: 92%;
    height: 92%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  #arrows {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #arrows path { fill: var(--arrow); }
  #list-row {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    border-top: 1px solid #e5e5e5;
    border-bottom: 1px solid #e5e5e5;
  }
  #moves-wrap {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }
  #moves { display: grid; grid-template-columns: auto auto minmax(0, 1fr); }
  .row {
    display: grid;
    grid-template-columns: subgrid;
    grid-column: 1 / -1;
    font-size: 15px;
    border-bottom: 1px solid rgba(46, 125, 50, 0.30);
    padding: 4px 8px;
    align-items: center;
    column-gap: 6px;
  }
  .row:last-child { border-bottom: none; }
  .row.selected { background: rgba(46, 125, 50, 0.55); }
  .row .san   { font-weight: 600; visibility: hidden; white-space: nowrap; }
  .row.selected .san { visibility: visible; }
  .row .score { color: #888; font-size: 13px; white-space: nowrap; }
  .row .score-bar {
    position: relative;
    align-self: stretch;
    background: white;
    border: 1px solid #ccc;
  }
  .row .score-bar-fill {
    display: block;
    position: absolute;
    top: 0; bottom: 0; left: 0;
    background: black;
  }
  .row .score-cells {
    display: inline-flex;
    gap: 2px;
    vertical-align: middle;
    align-self: center;
  }
  .row .score-cell {
    display: inline-block;
    width: 8px; height: 12px;
    background: #888;
  }
  .row .score-cells.good .score-cell { background: rgba(102, 41, 102, 0.7); }
  .row .score-cells.bad  .score-cell { background: rgba(220, 20, 60, 0.7); }
  #minibar {
    flex: 0 0 auto;
    width: 8px;
    display: flex;
    flex-direction: column;
    align-self: stretch;
    background: transparent;
  }
  .mini-rect {
    display: block;
    width: 100%;
    background: rgba(0, 0, 0, 0.10);
    border-top: 1px solid rgba(255, 255, 255, 0.6);
    box-sizing: border-box;
  }
  .mini-rect:first-child { border-top: none; }
  .mini-rect.on { background: rgba(46, 125, 50, 0.85); }
  #engine-status {
    position: absolute;
    top: 4px;
    right: 8px;
    background: rgba(0, 0, 0, 0.04);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 13px;
    color: #888;
    pointer-events: none;
    z-index: 1;
  }
  #engine-status[hidden] { display: none; }
  .sq.src-highlight { box-shadow: inset 0 0 0 3px var(--accent); }
  .sq.dst-highlight { box-shadow: inset 0 0 0 3px rgba(76, 175, 80, 0.85); }
  .sq.src-highlight.dst-highlight {
    box-shadow: inset 0 0 0 3px var(--accent),
                inset 0 0 0 6px rgba(76, 175, 80, 0.85);
  }
  .promo-popup {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .promo-popup.hidden { display: none; }
  .promo-card {
    background: white; padding: 12px; border-radius: 6px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .promo-buttons { display: flex; gap: 6px; }
  .promo-buttons button {
    padding: 4px; border: 1px solid #ddd;
    background: #fff; cursor: pointer;
  }
  .promo-buttons img { width: 48px; height: 48px; }
  .promo-cancel { padding: 6px 12px; }
  #share-row {
    flex: 0 0 auto;
    display: flex;
  }
  #share {
    flex: 1 1 auto;
    min-width: 0;
    height: 48px;
    padding: 12px 16px;
    font-size: 16px; font-weight: 600;
    border: none; border-radius: 0;
    background: var(--accent); color: #fff;
    cursor: pointer;
  }
  #share[disabled] { background: #999; }
  #back {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none; border-radius: 0;
    background: #444; color: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #back svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: block;
  }
  #back[disabled] { color: #888; cursor: default; }
  #play {
    flex: 1 1 auto;
    min-width: 0;
    height: 48px;
    padding: 12px 16px;
    font-size: 16px; font-weight: 600;
    border: none; border-radius: 0;
    background: #fff; color: var(--accent);
    box-shadow: inset 0 0 0 2px var(--accent);
    cursor: pointer;
  }
  #play[disabled] { color: #aaa; box-shadow: inset 0 0 0 2px #ccc; cursor: default; }
  @media (max-width: 360px) {
    :root { --cell: 11.5vw; }
    .row { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="board-wrap">
  <div id="board" role="grid" aria-label="chess board"></div>
  <svg id="arrows" preserveAspectRatio="none"></svg>
</div>
<div id="list-row">
  <div id="moves-wrap">
    <div id="engine-status" hidden></div>
    <div id="moves" role="list"></div>
  </div>
  <div id="minibar" aria-hidden="true"></div>
</div>
<div id="share-row">
  <button id="back" type="button" disabled aria-label="Back" title="Back">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M15 5l-7 7 7 7"/>
    </svg>
  </button>
  <button id="play" type="button" disabled>Play</button>
  <button id="share" disabled>Share</button>
</div>

<div id="promo-popup" class="promo-popup hidden" role="dialog" aria-label="Choose promotion piece">
  <div class="promo-card">
    <div class="promo-title">Promote to…</div>
    <div class="promo-buttons"></div>
    <button class="promo-cancel" type="button" aria-label="Cancel">Cancel</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chess.js@0.12.0/chess.min.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
